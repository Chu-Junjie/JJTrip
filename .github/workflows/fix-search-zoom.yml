name: Fix mobile search zoom

on:
  push:
    paths:
      - .github/workflows/fix-search-zoom.yml

permissions:
  contents: write

jobs:
  patch-search-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent mobile browser auto zoom
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/styles.css')
          text = path.read_text(encoding='utf-8')
          old = '  .search-box input { font-size: 11px; }'
          new = '  .search-box input { font-size: 16px; }'
          if old not in text:
              raise SystemExit('Expected mobile search rule was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit the CSS fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          git commit -m "fix: prevent mobile search auto zoom"
          git push
