name: Capture real JJTrip mobile view

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jjtrip-mobile-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start current JJTrip code
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jjtrip-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jjtrip-server.log
          exit 1

      - name: Capture actual 390 by 844 entry viewport
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --force-device-scale-factor=2 \
            --window-size=390,844 \
            --virtual-time-budget=8000 \
            --screenshot=mobile-real-view.png \
            "http://127.0.0.1:4173/?capture=real-mobile"
          file mobile-real-view.png
          test -s mobile-real-view.png

      - name: Commit screenshot and remove temporary workflow
        run: |
          rm -f .github/workflows/capture-real-mobile-view.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-real-view.png .github/workflows/capture-real-mobile-view.yml
          git commit -m "docs: add real JJTrip mobile entry view"
          git push origin HEAD:main
