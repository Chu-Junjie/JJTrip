name: Capture real JJTrip mobile view

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jjtrip-mobile-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start current JJTrip code
        id: server
        continue-on-error: true
        shell: bash
        run: |
          : > mobile-capture.log
          python3 -m http.server 4173 --bind 127.0.0.1 >> mobile-capture.log 2>&1 &
          echo $! > /tmp/jjtrip-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo "server=ready" >> mobile-capture.log
              exit 0
            fi
            sleep 1
          done
          echo "server=failed" >> mobile-capture.log
          exit 1

      - name: Capture actual 390 by 844 entry viewport
        id: screenshot
        continue-on-error: true
        shell: bash
        run: |
          set +e
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome=$CHROME" >> mobile-capture.log
          if [ -z "$CHROME" ]; then
            echo "result=no-browser" >> mobile-capture.log
            exit 0
          fi
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --force-device-scale-factor=2 \
            --window-size=390,844 \
            --virtual-time-budget=10000 \
            --screenshot=mobile-real-view.png \
            "http://127.0.0.1:4173/?capture=real-mobile" \
            >> mobile-capture.log 2>&1
          STATUS=$?
          echo "chrome_status=$STATUS" >> mobile-capture.log
          if [ -s mobile-real-view.png ]; then
            file mobile-real-view.png >> mobile-capture.log
            echo "result=success" >> mobile-capture.log
          else
            echo "result=no-screenshot" >> mobile-capture.log
          fi
          exit 0

      - name: Commit result and remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/capture-real-mobile-view.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -s mobile-real-view.png ]; then
            git commit -m "docs: add real JJTrip mobile entry view"
          else
            git commit -m "chore: record failed JJTrip mobile capture"
          fi
          git push origin HEAD:main
