name: Apply mascot navigation and card action layout

on:
  push:
    paths:
      - .github/workflows/apply-nav-mascot-card-actions.yml
      - .github/ui-refinement-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS-only UI refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* v7.2 settings mascot navigation and compact detail actions. */'
          if marker not in css:
              css += r'''

/* v7.2 settings mascot navigation and compact detail actions. */
.floating-mascot {
  display: none !important;
}

.bottom-nav {
  overflow: visible;
}

.bottom-nav [data-nav="settings"] {
  position: relative;
  overflow: visible;
  isolation: isolate;
}

.bottom-nav [data-nav="settings"] > span {
  visibility: hidden;
}

.bottom-nav [data-nav="settings"]::before {
  position: absolute;
  z-index: 3;
  top: -43px;
  left: 50%;
  width: 58px;
  height: 82px;
  transform: translateX(-50%);
  background: url("./jjtrip-mascot-3d.png") center bottom / contain no-repeat;
  filter: drop-shadow(0 7px 8px rgba(31, 60, 89, 0.22));
  content: "";
  pointer-events: none;
}

.bottom-nav [data-nav="settings"]::after {
  position: absolute;
  z-index: 2;
  top: 23px;
  left: 50%;
  width: 40px;
  height: 13px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: rgba(31, 60, 89, 0.16);
  filter: blur(5px);
  content: "";
  pointer-events: none;
}

.bottom-nav [data-nav="settings"] > b {
  margin-top: 27px;
}

.bottom-nav [data-nav="settings"].active::before {
  transform: translateX(-50%) translateY(-2px) scale(1.04);
}

.detail-panel {
  display: flex;
  flex-direction: column;
}

.detail-panel > * {
  order: 4;
}

.detail-panel > .panel-close {
  position: absolute;
  z-index: 6;
  top: 12px;
  right: 12px;
  order: 0;
  float: none;
}

.detail-panel > .place-heading {
  order: 1;
}

.detail-panel > .place-gallery {
  order: 2;
}

.detail-panel > .detail-primary-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  order: 3;
  width: 100%;
  gap: 8px;
  margin: 2px 0 15px;
}

.detail-panel > .detail-primary-actions .plan-state {
  display: none;
}

.detail-panel > .detail-primary-actions > button {
  width: 100%;
  min-width: 0;
  margin: 0;
  white-space: nowrap;
}

@media (max-width: 720px) {
  .bottom-nav [data-nav="settings"]::before {
    top: -39px;
    width: 54px;
    height: 77px;
  }

  .bottom-nav [data-nav="settings"] > b {
    margin-top: 25px;
  }
}
'''
              path.write_text(css, encoding='utf-8')
          PY
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: place mascot in settings navigation"
          git pull --rebase
          git push
