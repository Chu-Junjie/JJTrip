name: Trim JJTrip places

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce seed and saved places
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          cities = ["hongkong", "singapore", "shenzhen", "macau", "kualalumpur"]
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          for city in cities:
              pattern = re.compile(
                  rf'(    {city}:city\(.*?,\[\n)(.*?)(\n    \]\))',
                  re.DOTALL,
              )
              match = pattern.search(html)
              if not match:
                  raise SystemExit(f"Could not find {city} seed block")
              lines = [line for line in match.group(2).splitlines() if line.strip()]
              place_lines = [line for line in lines if line.lstrip().startswith("poi(")]
              if len(place_lines) < 18:
                  raise SystemExit(f"{city} has only {len(place_lines)} places")
              kept = place_lines[:18]
              html = html[:match.start()] + match.group(1) + "\n".join(kept) + match.group(3) + html[match.end():]

          migration = '''  <script>
            (() => {
              const dataKey = "jjtrip_mvp_v3";
              const migrationKey = "jjtrip_places_18_v1";
              try {
                if (localStorage.getItem(migrationKey) === "1") return;
                const raw = localStorage.getItem(dataKey);
                if (raw) {
                  const data = JSON.parse(raw);
                  for (const cityId of ["hongkong", "singapore", "shenzhen", "macau", "kualalumpur"]) {
                    const city = data.cities?.[cityId];
                    if (!city) continue;
                    city.places = Array.isArray(city.places) ? city.places.slice(0, 18) : [];
                    const validIds = new Set(city.places.map(place => String(place.id)));
                    if (Array.isArray(city.routePlans)) {
                      for (const plan of city.routePlans) {
                        plan.route = Array.isArray(plan.route) ? plan.route.filter(id => validIds.has(String(id))) : [];
                        if (plan.segments && typeof plan.segments === "object") {
                          plan.segments = Object.fromEntries(Object.entries(plan.segments).filter(([key]) => {
                            const [startId, endId] = key.split("__");
                            return validIds.has(startId) && validIds.has(endId);
                          }));
                        }
                      }
                    }
                    city.route = Array.isArray(city.route) ? city.route.filter(id => validIds.has(String(id))) : [];
                    if (city.segments && typeof city.segments === "object") {
                      city.segments = Object.fromEntries(Object.entries(city.segments).filter(([key]) => {
                        const [startId, endId] = key.split("__");
                        return validIds.has(startId) && validIds.has(endId);
                      }));
                    }
                  }
                  localStorage.setItem(dataKey, JSON.stringify(data));
                }
                localStorage.setItem(migrationKey, "1");
              } catch (_) {}
            })();
          </script>
          <script src="./assets/app.js?v=20260806-places-18"></script>'''

          old_script = '  <script src="./assets/app.js?v=20260806-performance-2"></script>'
          if old_script not in html:
              raise SystemExit("Could not find current app script reference")
          html = html.replace(old_script, migration, 1)
          html = html.replace("20260806-performance-2", "20260806-places-18")
          path.write_text(html, encoding="utf-8")

          for city in cities:
              pattern = re.compile(rf'    {city}:city\(.*?,\[\n(.*?)\n    \]\)', re.DOTALL)
              block = pattern.search(html)
              count = sum(1 for line in block.group(1).splitlines() if line.lstrip().startswith("poi("))
              if count != 18:
                  raise SystemExit(f"{city} has {count} places after trimming")

          Path(".github/workflows/trim-jjtrip-places.yml").unlink()
          PY

      - name: Commit reduced data
        shell: bash
        run: |
          grep -q 'jjtrip_places_18_v1' index.html
          grep -q '20260806-places-18' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: limit each JJTrip city to 18 places"
          git push origin HEAD:main
