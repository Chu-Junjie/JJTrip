name: Apply UI refinements

on:
  push:
    paths:
      - .github/workflows/apply-ui-refinements.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused UI patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/ui-refinements.patch
          git apply --check /tmp/ui-refinements.patch
          git apply /tmp/ui-refinements.patch
          node --check assets/app.js
      - name: Commit focused changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/styles.css
          git commit -m "fix: refine favourites detail card and mascot"
          git push
