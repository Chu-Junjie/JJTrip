name: Remove JJTrip Base64 images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair cleanup script quoting
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/remove_base64.py")
          text = path.read_text(encoding="utf-8")
          replacement = '''        helper = """  function isBase64ImageSource(value) {
            return /^data:image\\//i.test(String(value || "").trim());
          }

          """
          '''
          text, count = re.subn(r'        helper = \(\n.*?        \)\n', replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("Could not repair helper string")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply cleanup migration
        run: python scripts/remove_base64.py

      - name: Validate optimized application
        run: |
          node --check assets/app.js
          ! grep -q 'readAsDataURL' assets/app.js
          ! grep -q 'canvas.toDataURL' assets/app.js
          ! grep -q 'id="imageUpload"' assets/app.js
          grep -q 'jjtrip_remove_base64_v1' index.html
          grep -q '20260806-no-base64-1' index.html
          test ! -e assets/app.js.bak
          test ! -e assets/app.js.pre7
          test ! -e scripts/remove_base64.py
          test ! -e .github/workflows/remove-jjtrip-base64.yml

      - name: Commit cleaned application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: remove Base64 images from JJTrip"
          git push origin HEAD:main
