name: Verify JJTrip cleanup workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .base64-workflow-ran
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .base64-workflow-ran
          git commit -m "test: confirm Base64 cleanup runner"
          git push origin HEAD:main
