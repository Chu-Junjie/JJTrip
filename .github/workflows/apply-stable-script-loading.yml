name: Apply stable script loading fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch script loading order and cache busting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          old_scripts = '''  <script src="./assets/map-layouts.js"></script>
  <script src="./assets/app.js"></script>'''
          new_scripts = '''  <script src="./assets/map-layouts-core-v7.js"></script>
  <script src="./assets/map-layouts.js"></script>
  <script src="./assets/app.js"></script>'''
          if old_scripts in index:
              index = index.replace(old_scripts, new_scripts, 1)
          elif './assets/map-layouts-core-v7.js' not in index:
              raise SystemExit("Expected script block was not found in index.html")
          index_path.write_text(index, encoding="utf-8")

          map_path = Path("assets/map-layouts.js")
          map_code = map_path.read_text(encoding="utf-8")
          loader = '''  document.write('<script src="./assets/map-layouts-core-v7.js"><' + '/script>');

'''
          if loader in map_code:
              map_code = map_code.replace(loader, "", 1)
          if "document.write" in map_code:
              raise SystemExit("Unexpected document.write remains in map-layouts.js")
          map_path.write_text(map_code, encoding="utf-8")

          deploy_path = Path(".github/workflows/deploy-jjtrip-pages.yml")
          deploy = deploy_path.read_text(encoding="utf-8")
          old_entry = "              './assets/map-layouts.js': f'./assets/map-layouts.js?v={version}',"
          core_entry = "              './assets/map-layouts-core-v7.js': f'./assets/map-layouts-core-v7.js?v={version}',"
          if core_entry not in deploy:
              if old_entry not in deploy:
                  raise SystemExit("Cache-busting replacement block was not found")
              deploy = deploy.replace(old_entry, core_entry + "\n" + old_entry, 1)
          deploy_path.write_text(deploy, encoding="utf-8")
          PY

          node --check assets/map-layouts-core-v7.js
          node --check assets/map-layouts.js
          node --check assets/app.js
          grep -n 'map-layouts-core-v7.js\|map-layouts.js\|app.js' index.html | tail -n 3

      - name: Commit stable loading fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/map-layouts.js .github/workflows/deploy-jjtrip-pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: load map assets in stable order"
          git pull --rebase
          git push
