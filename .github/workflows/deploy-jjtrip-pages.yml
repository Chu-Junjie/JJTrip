name: Deploy JJTrip Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jjtrip-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Bust browser asset cache
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          version = os.environ["GITHUB_SHA"][:12]
          replacements = {
              './assets/styles.css': f'./assets/styles.css?v={version}',
              './assets/map-layouts-core-v7.js': f'./assets/map-layouts-core-v7.js?v={version}',
              './assets/map-layouts.js': f'./assets/map-layouts.js?v={version}',
              './assets/app.js': f'./assets/app.js?v={version}',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
